{{- if .Values.traefik.enabled }}
{{- if .Values.traefik.useIngressRoute }}
# Traefik IngressRoute CRD - routes directly to services
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "onyx.fullname" . }}-strip-api
  labels:
    {{- include "onyx.labels" . | nindent 4 }}
spec:
  stripPrefix:
    prefixes:
    - /api
---
{{- if .Values.traefik.certManager }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "onyx.fullname" . }}-acme-cert
  labels:
    {{- include "onyx.labels" . | nindent 4 }}
spec:
  secretName: {{ include "onyx.fullname" . }}-acme-cert
  issuerRef:
    name: {{ .Values.traefik.certManager.issuer | default "letsencrypt-http01" }}
    kind: {{ .Values.traefik.certManager.issuerKind | default "ClusterIssuer" }}
  dnsNames:
    - {{ .Values.traefik.domain }}
---
{{- end }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "onyx.fullname" . }}-ingressroute
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "onyx.labels" . | nindent 4 }}
spec:
  entryPoints:
    - {{ .Values.traefik.entryPoint | default "websecure" }}
  routes:
    - match: Host(`{{ .Values.traefik.domain }}`) && PathPrefix(`/api`)
      kind: Rule
      middlewares:
        - name: {{ include "onyx.fullname" . }}-strip-api
      services:
        - name: {{ include "onyx.fullname" . }}-api-service
          port: {{ .Values.api.service.servicePort | default 8080 }}
    - match: Host(`{{ .Values.traefik.domain }}`)
      kind: Rule
      services:
        - name: {{ include "onyx.fullname" . }}-webserver
          port: {{ .Values.webserver.service.servicePort | default 3000 }}
  tls:
    secretName: {{ include "onyx.fullname" . }}-acme-cert
{{- else }}
# Standard Ingress with Traefik class - routes directly to services
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "onyx.fullname" . }}-https-redirect
  labels:
    {{- include "onyx.labels" . | nindent 4 }}
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "onyx.fullname" . }}-strip-api
  labels:
    {{- include "onyx.labels" . | nindent 4 }}
spec:
  stripPrefix:
    prefixes:
    - /api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "onyx.fullname" . }}-ingress
  labels:
    {{- include "onyx.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/tls-acme: "true"
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ include "onyx.fullname" . }}-https-redirect@kubernetescrd,{{ .Release.Namespace }}-{{ include "onyx.fullname" . }}-strip-api@kubernetescrd
    {{- with .Values.traefik.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: traefik
  rules:
  - host: {{ .Values.traefik.domain }}
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: {{ include "onyx.fullname" . }}-api-service
            port:
              number: {{ .Values.api.service.servicePort }}
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "onyx.fullname" . }}-webserver
            port:
              number: {{ .Values.webserver.service.servicePort }}
  tls:
  - hosts:
    - {{ .Values.traefik.domain }}
    secretName: {{ include "onyx.fullname" . }}-acme-cert
{{- end }}
{{- end }}
