# Dev environment overrides for single-node k3s deployment
# Usage: helm upgrade onyx ./deployment/helm/charts/onyx -n chat-dev -f ./deployment/helm/charts/onyx/values.dev.yaml
#
# This config deploys dedicated PostgreSQL/Valkey/MinIO instances in-namespace
# and reuses shared Bud platform services (Keycloak, MCP, Foundry) from "bud" namespace.

global:
  defaultStorageClass: "local-path"
  version: "nightly"
  pullPolicy: "IfNotPresent"

# Model servers: keep on 0.2.0 (available on Docker Hub, code unchanged)
inferenceCapability:
  image:
    tag: "0.2.0"

indexCapability:
  image:
    tag: "0.2.0"

# ----- Local infra: dedicated instances in chat-dev namespace -----

postgresql:
  enabled: true
  auth:
    username: "onyx_studio"
    database: "onyx_studio"
  primary:
    extendedConfiguration: |
      max_connections = 300
    persistence:
      storageClass: "local-path"

valkey:
  enabled: true
  master:
    persistence:
      storageClass: "local-path"

minio:
  enabled: true
  persistence:
    storageClass: "local-path"

# ----- Vespa: onyx-managed, use local-path storage -----

vespa:
  volumeClaimTemplates:
    - metadata:
        name: vespa-storage
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 30Gi
        storageClassName: "local-path"

persistent:
  storageClassName: "local-path"

# ----- Configuration -----
# POSTGRES_HOST, REDIS_HOST, S3_ENDPOINT_URL are NOT overridden here
# so they default to in-namespace services ({release}-postgresql, {release}-valkey-primary, {release}-minio)

configMap:
  AUTH_TYPE: "oidc"
  POSTGRES_DB: "onyx_studio"
  S3_FILE_STORE_BUCKET_NAME: "onyx-studio-file-store-bucket"
  # Keycloak (shared from bud namespace)
  OPENID_CONFIG_URL: "http://bud-keycloak.bud.svc.cluster.local/realms/bud-keycloak/.well-known/openid-configuration"
  KEYCLOAK_ADMIN_USERNAME: "user"
  KEYCLOAK_REALM: "bud-keycloak"
  ONYX_CLIENT_NAME: "onyx-studio-client"
  # Bud platform integration (shared from bud namespace)
  BUD_FOUNDRY_API_BASE: "https://gateway.pnap.bud.studio/v1"
  BUD_FOUNDRY_APP_BASE: "https://app.pnap.bud.studio"
  BUD_MCP_GATEWAY_URL: "http://bud-mcpgateway.bud.svc.cluster.local:4444/mcp"
  BUD_DEFAULT_MCP_SERVERS: "taskgraph=http://bud-taskgraph.bud.svc.cluster.local:8484/mcp"
  # Domain
  WEB_DOMAIN: "https://chat-dev.pnap.bud.studio"
  DOMAIN: "chat-dev.pnap.bud.studio"
  SESSION_EXPIRE_TIME_SECONDS: "86400"
  QA_TIMEOUT: "60"

# ----- Auth secrets: credentials for local infra -----

auth:
  postgresql:
    enabled: true
    secretName: 'onyx-postgresql'
    existingSecret: ""
    secretKeys:
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
    values:
      username: "onyx_studio"
      password: "onyx_studio"
  redis:
    enabled: true
    secretName: 'onyx-redis'
    existingSecret: ""
    secretKeys:
      REDIS_PASSWORD: redis_password
    values:
      redis_password: "bud"
  objectstorage:
    enabled: true
    secretName: 'onyx-objectstorage'
    existingSecret: ""
    secretKeys:
      S3_AWS_ACCESS_KEY_ID: s3_aws_access_key_id
      S3_AWS_SECRET_ACCESS_KEY: s3_aws_secret_access_key
    values:
      s3_aws_access_key_id: "bud-runtime"
      s3_aws_secret_access_key: "zLtczNA8EJ=ge2sSHE?xmZKy"
      rootUser: "bud-runtime"
      rootPassword: "zLtczNA8EJ=ge2sSHE?xmZKy"
  oauth:
    enabled: true
    secretName: 'onyx-oauth'
    existingSecret: ""
    secretKeys:
      OAUTH_CLIENT_ID: "oauth_client_id"
      OAUTH_CLIENT_SECRET: "oauth_client_secret"
      OAUTH_COOKIE_SECRET: "oauth_cookie_secret"
      KEYCLOAK_ADMIN_PASSWORD: "keycloak_admin_password"
    values:
      oauth_client_id: ""
      oauth_client_secret: ""
      oauth_cookie_secret: "bud-studio-cookie-secret-32chars"
      keycloak_admin_password: "bud-oA6ptv%Yatgp?VgH"

# ----- Disable bundled nginx (conflicts with existing IngressClass) -----

nginx:
  enabled: false

# ----- Traefik Ingress: expose via chat-dev.pnap.bud.studio -----

traefik:
  enabled: true
  useIngressRoute: true
  entryPoint: "websecure"
  domain: "chat-dev.pnap.bud.studio"
  certManager:
    issuer: "letsencrypt-http01"
    issuerKind: "ClusterIssuer"
